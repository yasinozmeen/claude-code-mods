<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrin</title>
<style>
  :root {
    --bg: #1f2023; --panel: #292b30; --line: #3a3d44; --text: #e6e7ea; --dim: #9aa0aa; --accent: #8ab4f8;
    --well: #121316; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  /* `all: unset` on the buttons would undo the attribute's own rule. */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; -webkit-font-smoothing: antialiased;
    user-select: none; }
  #scroll { height: 100%; overflow: hidden; padding: 0 12px 24px; }
  header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px;
    padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  header b { font-size: 14px; }
  header span { color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { position: relative; display: flex; border: 1px solid var(--line); }
  .chips button { all: unset; position: relative; z-index: 1; padding: 4px 12px; cursor: pointer; color: var(--dim);
    transition: color .2s var(--ease); }
  .chips button[aria-pressed="true"] { color: #10131a; }
  .chips i { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background: var(--accent);
    transition: transform .22s var(--ease); }
  .chips[data-mode="all"] i { transform: translateX(100%); }
  .act { all: unset; padding: 4px 12px; border: 1px solid var(--line); color: var(--text); cursor: pointer;
    white-space: nowrap; transition: border-color .18s var(--ease), background .18s var(--ease), color .18s var(--ease); }
  .act:hover { border-color: var(--dim); }
  .act:active { background: var(--panel); }
  .act.main { border-color: var(--accent); color: var(--accent); }
  .act.quiet { color: var(--dim); }
  .act.icon { display: grid; place-items: center; padding: 5px 8px; }
  .act.icon svg { width: 15px; height: 15px; display: block; }
  #stage { margin: 12px 0 8px; background: var(--well); border: 1px solid var(--line); display: grid;
    place-items: center; min-height: 120px; overflow: hidden; }
  #stage > * { max-width: 100%; max-height: var(--tall, 420px); display: block; animation: in .25s var(--ease); }
  #stage iframe { width: 100%; height: var(--tall, 420px); border: 0; background: #fff; }
  #stage audio { width: 100%; margin: 28px 0; }
  /* A markdown file is read, not looked at: as wide as the stage, and a
     window of its own over a long text, which the wheel moves while the
     pointer is over it. */
  #stage .doc, #stage .pair > div > .doc { justify-self: stretch; align-self: start; max-height: var(--tall, 420px);
    overflow-y: hidden; padding: 4px 18px 18px; user-select: text; cursor: text; font: 14px/1.6 -apple-system, "Helvetica Neue", sans-serif; overflow-wrap: anywhere; }
  /* How far through the text the window is: a mark down its right edge,
     kept in place while the text moves under it. */
  .doc .far { position: sticky; top: 0; height: 0; user-select: none; }
  .doc .far i { position: absolute; right: -13px; width: 4px; background: var(--dim); opacity: .7;
    transition: opacity .2s var(--ease); }
  .doc ::selection { background: #8ab4f855; }
  .doc h1, .doc h2, .doc h3, .doc h4 { margin: 1.2em 0 .4em; line-height: 1.25; }
  .doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .doc h3 { font-size: 15px; } .doc h4 { font-size: 14px; color: var(--dim); }
  .doc p, .doc ul, .doc ol, .doc pre, .doc table, .doc blockquote { margin: .6em 0; }
  .doc ul, .doc ol { padding-left: 1.5em; }
  .doc li > ul, .doc li > ol { margin: 0; }
  .doc code { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; background: var(--panel); padding: 1px 4px; }
  .doc pre { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; overflow: hidden;
    white-space: pre-wrap; }
  .doc pre code { background: none; padding: 0; }
  .doc blockquote { padding-left: 12px; border-left: 2px solid var(--accent); color: var(--dim); }
  .doc a { color: var(--accent); text-decoration: underline; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .doc table { border-collapse: collapse; width: 100%; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .doc th { background: var(--panel); }
  .doc del, .doc .none { color: var(--dim); }
  /* Two files side by side, or for two pictures one over the other with a
     divider that is dragged. */
  #stage .pair { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  #stage .pair > div { background: var(--well); display: grid; place-items: center; min-width: 0; }
  #stage .pair > div > * { max-width: 100%; max-height: var(--tall, 420px); display: block; }
  #stage .pair iframe { width: 100%; height: var(--tall, 420px); border: 0; background: #fff; }
  #stage .slide { position: relative; width: 100%; max-height: var(--tall, 420px); cursor: ew-resize; }
  #stage .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; max-height: none; }
  #stage .slide .bar { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); }
  #stage .slide .bar::after { content: ""; position: absolute; top: 50%; left: 50%; width: 12px; height: 28px;
    margin: -14px 0 0 -6px; background: var(--accent); }
  #stage .slide u { position: absolute; top: 8px; padding: 2px 6px; background: #000a; color: var(--text);
    text-decoration: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #meta { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  #meta b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #meta span { color: var(--dim); white-space: nowrap; }
  #actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { all: unset; position: relative; cursor: pointer; display: block; border: 1px solid var(--line); background: var(--panel);
    transition: border-color .18s var(--ease), transform .18s var(--ease); animation: in .25s var(--ease); }
  .card:hover { transform: translateY(-2px); border-color: var(--dim); }
  .card[aria-current="true"] { border-color: var(--accent); }
  .card[data-second="true"] { border-color: var(--accent); border-style: dashed; }
  .card .thumb { aspect-ratio: 16 / 10; background: var(--well) center / contain no-repeat; }
  .card .name { padding: 6px 8px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .18s var(--ease); }
  .card[aria-current="true"] .name, .card[data-second="true"] .name, .card:hover .name { color: var(--text); }
  /* Takes the one file out of the list; the file itself stays on disk. */
  .card .drop { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; display: grid;
    place-items: center; background: #000a; color: var(--dim); border: 1px solid var(--line);
    transition: color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease); }
  .card .drop:hover { color: #fff; border-color: #e5484d; background: #e5484d; }
  .card .drop svg { width: 10px; height: 10px; display: block; }
  #empty { color: var(--dim); padding: 40px 0; text-align: center; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="scroll">
  <header>
    <b>Vitrin</b><span id="count"></span>
    <div class="chips" id="chips" data-mode="chat">
      <i></i>
      <button data-mode="chat" aria-pressed="true">Sohbet</button>
      <button data-mode="all" aria-pressed="false">Hepsi</button>
    </div>
    <button class="act quiet icon" id="clear" aria-label="Listeyi temizle">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square">
        <path d="M2.5 4.5h11M6 4.5V2.5h4v2M4 4.5l.6 9h6.8l.6-9M6.6 7v4M9.4 7v4"/>
      </svg>
    </button>
  </header>
  <div id="stage"></div>
  <div id="meta"></div>
  <div id="actions">
    <button class="act main" data-act="look">Büyüt</button>
    <button class="act" data-act="open">Aç</button>
    <button class="act" data-act="copy" id="copy">Yolu kopyala</button>
    <button class="act quiet" id="layout" hidden></button>
    <button class="act quiet" id="single" hidden>Karşılaştırmayı kapat</button>
  </div>
  <div id="grid"></div>
  <div id="empty" hidden></div>
</div>
<script>
document.documentElement.style.zoom = new URLSearchParams(location.search).get('zoom') ?? 1
const LABEL = { image: 'resim', video: 'video', audio: 'ses', pdf: 'PDF', page: 'web sayfası', doc: 'belge' }
const scroller = document.getElementById('scroll')
const stage = document.getElementById('stage')
const meta = document.getElementById('meta')
const actions = document.getElementById('actions')
const grid = document.getElementById('grid')
const chips = document.getElementById('chips')
const empty = document.getElementById('empty')
const copy = document.getElementById('copy')
const single = document.getElementById('single')
const layout = document.getElementById('layout')
const clear = document.getElementById('clear')
let items = []
let mode = 'chat'
let current = null
// The file compared with the current one, when there is one.
let second = null
// How the pair is laid out when the person chose: 'slide' or 'pair'; null
// leaves it to the pictures' shapes.
let chosen = null
let drawn = ''
let staged = ''
let picked = 0
let target = 0
let position = 0
// The modifier keys the pane last reported: 1 alt, 2 ctrl.
let mods = 0
// How far down each document was read, by its id.
const read = new Map()
// The document the wheel is moving, where it is heading and where it is.
const inner = { doc: null, target: 0, position: 0 }

const src = (item, as) => `/file?id=${item.id}${as ? `&as=${as}` : ''}`
const shown = () => (mode === 'chat' ? items.filter(one => one.from === 'chat') : items)
const byId = id => items.find(one => one.id === id)
const clock = ms => new Date(ms).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
const isPicture = item => item.kind === 'image' || item.kind === 'pdf'
// Two pictures of one shape are a before and an after: those are laid one
// over the other. Pictures of different shapes would each show in pieces
// there, so they stand side by side, as every other kind does.
const isSameShape = (a, b) => a.height > 0 && b.height > 0 && Math.abs(a.width / a.height - b.width / b.height) < 0.03
// What a browser cannot draw itself is shown as its prepared preview.
const picture = item => src(item, item.kind === 'pdf' || /\.(heic|tiff?|bmp)$/i.test(item.path) ? 'preview' : '')

// A button of the page the mod acts on: the bridge passes it along.
const act = sent => fetch('/act', { method: 'POST', body: JSON.stringify(sent) })

function nodeFor(item) {
  if (item.kind === 'video') {
    return Object.assign(document.createElement('video'), { src: src(item), controls: true, preload: 'auto' })
  }

  if (item.kind === 'audio') {
    return Object.assign(document.createElement('audio'), { src: src(item), controls: true })
  }

  if (item.kind === 'page') {
    return Object.assign(document.createElement('iframe'), { src: src(item) })
  }

  if (item.kind === 'doc') {
    const doc = Object.assign(document.createElement('div'), { className: 'doc' })
    doc.dataset.id = item.id
    void fetch(src(item)).then(got => got.text()).then(text => {
      doc.innerHTML = marked(text)
      // Back where it was left when another file was looked at meanwhile.
      const far = Object.assign(document.createElement('div'), { className: 'far' })
      const mark = far.appendChild(document.createElement('i'))
      doc.prepend(far)
      const place = () => {
        const room = doc.scrollHeight - doc.clientHeight
        const tall = Math.max(24, (doc.clientHeight * doc.clientHeight) / doc.scrollHeight)
        mark.hidden = room < 1
        mark.style.height = `${tall}px`
        mark.style.top = `${(doc.scrollTop / Math.max(1, room)) * (doc.clientHeight - tall - 8)}px`
      }

      doc.scrollTop = read.get(item.id) ?? 0
      doc.addEventListener('scroll', () => {
        read.set(item.id, doc.scrollTop)
        place()
      })
      addEventListener('resize', place)
      place()
    })

    return doc
  }

  return Object.assign(new Image(), { src: picture(item) })
}

const escaped = text => text.replace(/[&<>"]/g, sign => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[sign]))

// One line's markdown as HTML. The text is escaped first, so nothing a file
// holds runs here; a link is drawn but leads nowhere, since following it
// would take this page away.
function inline(text) {
  const codes = []
  const kept = escaped(text).replace(/`([^`]+)`/g, (_, code) => `\u0000${codes.push(code) - 1}\u0000`)

  return kept
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '<span class="none">[$1]</span>')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '<a>$1</a>')
    .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<b>${a ?? b}</b>`)
    .replace(/(?<![\w*])\*([^*\n]+)\*(?!\w)|(?<![\w_])_([^_\n]+)_(?!\w)/g, (_, a, b) => `<i>${a ?? b}</i>`)
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\u0000(\d+)\u0000/g, (_, at) => `<code>${codes[Number(at)]}</code>`)
}

const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(cell => inline(cell.trim()))
const ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/

// The items from `at` on that sit at `indent` or deeper, as one list; a
// deeper item opens a list inside the one before it.
function listed(lines, at, indent) {
  const isOrdered = /\d/.test(ITEM.exec(lines[at])[2])
  let html = ''
  let i = at

  while (i < lines.length) {
    const found = ITEM.exec(lines[i])

    if (found === null || found[1].length < indent) {
      break
    }

    if (found[1].length > indent + 1) {
      const inner = listed(lines, i, found[1].length)
      html = html.replace(/<\/li>$/, `${inner.html}</li>`)
      i = inner.next
      continue
    }

    const box = /^\[([ xX])\]\s+(.*)$/.exec(found[3])
    const body = box === null ? inline(found[3]) : `${box[1] === ' ' ? '☐' : '☑'} ${inline(box[2])}`
    html += `<li>${body}</li>`
    i += 1

    // A line set under the item, not an item itself, is the item's text going on.
    while (i < lines.length && /^\s+\S/.test(lines[i]) && ITEM.exec(lines[i]) === null) {
      html = html.replace(/<\/li>$/, ` ${inline(lines[i].trim())}</li>`)
      i += 1
    }
  }

  const tag = isOrdered ? 'ol' : 'ul'

  return { html: `<${tag}>${html}</${tag}>`, next: i }
}

// A markdown file as HTML: the blocks a note or a plan is written in.
function marked(text) {
  // A comment is a note to whoever edits the file, not part of what is read.
  const lines = text.replace(/\r\n?/g, '\n').replace(/^---\n[\s\S]*?\n---\n/, '').replace(/<!--[\s\S]*?-->/g, '').split('\n')
  const out = []
  let i = 0

  while (i < lines.length) {
    const line = lines[i]
    const fence = /^\s*(```|~~~)/.exec(line)
    const head = /^(#{1,6})\s+(.*?)\s*#*$/.exec(line)

    if (fence !== null) {
      const body = []
      i += 1

      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) {
        body.push(lines[i])
        i += 1
      }

      i += 1
      out.push(`<pre><code>${escaped(body.join('\n'))}</code></pre>`)
    } else if (head !== null) {
      const level = Math.min(4, head[1].length)
      out.push(`<h${level}>${inline(head[2])}</h${level}>`)
      i += 1
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      out.push('<hr>')
      i += 1
    } else if (line.includes('|') && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1] ?? '')) {
      const rows = []
      const top = cells(line)
      i += 2

      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
        rows.push(cells(lines[i]))
        i += 1
      }

      const body = rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')
      out.push(`<table><tr>${top.map(cell => `<th>${cell}</th>`).join('')}</tr>${body}</table>`)
    } else if (/^\s*>/.test(line)) {
      const body = []

      while (i < lines.length && /^\s*>/.test(lines[i])) {
        body.push(lines[i].replace(/^\s*>\s?/, ''))
        i += 1
      }

      out.push(`<blockquote>${marked(body.join('\n'))}</blockquote>`)
    } else if (ITEM.test(line)) {
      const list = listed(lines, i, ITEM.exec(line)[1].length)
      out.push(list.html)
      i = list.next
    } else if (line.trim() === '') {
      i += 1
    } else {
      const body = []

      while (i < lines.length && lines[i].trim() !== '' && !/^\s*(```|~~~|#{1,6}\s|>)/.test(lines[i]) && !ITEM.test(lines[i])) {
        body.push(lines[i].trim())
        i += 1
      }

      out.push(`<p>${inline(body.join(' '))}</p>`)
    }
  }

  return out.join('')
}

// Two pictures in one box: the first shows left of the divider and the
// second right of it, and the divider follows the pointer while pressed.
function slider(first, other) {
  const box = Object.assign(document.createElement('div'), { className: 'slide' })
  const under = Object.assign(new Image(), { src: picture(first), draggable: false })
  const over = Object.assign(new Image(), { src: picture(other), draggable: false })
  const bar = Object.assign(document.createElement('i'), { className: 'bar' })
  const left = Object.assign(document.createElement('u'), { textContent: first.name })
  const right = Object.assign(document.createElement('u'), { textContent: other.name })
  // As tall as the first picture needs at this width, up to the stage's limit.
  box.style.aspectRatio = `${first.width || 16} / ${first.height || 10}`
  left.style.left = '8px'
  right.style.right = '8px'

  const place = share => {
    const at = Math.max(0, Math.min(1, share))
    // Each picture is cut at the divider, so one of another shape does not
    // show through beside the other.
    under.style.clipPath = `inset(0 ${(1 - at) * 100}% 0 0)`
    over.style.clipPath = `inset(0 0 0 ${at * 100}%)`
    bar.style.left = `${at * 100}%`
  }

  const follow = event => {
    const rect = box.getBoundingClientRect()
    place((event.clientX - rect.left) / rect.width)
  }

  box.addEventListener('mousedown', follow)
  box.addEventListener('mousemove', event => event.buttons === 1 && follow(event))
  box.append(under, over, bar, left, right)
  place(0.5)

  return box
}

function pair(first, other) {
  const box = Object.assign(document.createElement('div'), { className: 'pair' })

  for (const item of [first, other]) {
    const half = document.createElement('div')
    half.append(nodeFor(item))
    box.append(half)
  }

  return box
}

function mark() {
  for (const card of grid.children) {
    card.setAttribute('aria-current', String(card.dataset.id === current))
    card.dataset.second = String(card.dataset.id === second)
  }
}

// Draws the stage for the current file, or for the pair being compared; a
// stage already showing that is left alone, so a playing video plays on.
function show() {
  const item = byId(current)
  const other = second === null ? undefined : byId(second)

  if (item === undefined) {
    return
  }

  const canSlide = other !== undefined && isPicture(item) && isPicture(other)
  const isSlide = canSlide && (chosen ?? (isSameShape(item, other) ? 'slide' : 'pair')) === 'slide'
  const key = `${item.id}|${other?.id ?? ''}|${isSlide}`

  if (key !== staged) {
    staged = key

    if (other === undefined) {
      stage.replaceChildren(nodeFor(item))
    } else {
      stage.replaceChildren(isSlide ? slider(item, other) : pair(item, other))
    }
  }

  layout.hidden = !canSlide
  layout.textContent = isSlide ? 'Yan yana göster' : 'Üst üste göster'
  layout.dataset.next = isSlide ? 'pair' : 'slide'

  const detail = other === undefined
    ? `${LABEL[item.kind] ?? ''} · ${clock(item.addedAt)} · ${item.from === 'chat' ? 'sohbet' : 'araç'}`
    : `↔ ${other.name}`
  meta.replaceChildren(
    Object.assign(document.createElement('b'), { textContent: item.name }),
    Object.assign(document.createElement('span'), { textContent: detail }),
  )
  single.hidden = other === undefined
  mark()
}

function choose(id, isSecond) {
  chosen = null

  if (isSecond && current !== null && id !== current) {
    second = second === id ? null : id
  } else {
    current = id
    second = null
  }

  show()
}

// Keeps the chosen card in the window when the keys move the choice.
function reveal() {
  const card = [...grid.children].find(one => one.dataset.id === current)

  if (card === undefined) {
    return
  }

  const top = card.offsetTop - 60
  const bottom = card.offsetTop + card.offsetHeight + 16 - scroller.clientHeight

  if (target > top) {
    target = Math.max(0, top)
  } else if (target < bottom) {
    target = bottom
  }
}

function draw() {
  const list = shown()
  document.getElementById('count').textContent = `${list.length} dosya`
  empty.hidden = list.length > 0
  empty.textContent = items.length > 0
    ? `Sohbette gönderilen medya yok. Araçların ürettiği ${items.length} dosya Hepsi'nde.`
    : 'Henüz medya yok. Claude bir resim, video, PDF, ses ya da belge gönderdiğinde burada görünür.'
  stage.hidden = meta.hidden = actions.hidden = list.length === 0
  clear.hidden = items.length === 0
  chips.dataset.mode = mode

  for (const chip of chips.querySelectorAll('button')) {
    chip.setAttribute('aria-pressed', String(chip.dataset.mode === mode))
  }

  const key = list.map(one => one.id).join()

  if (key !== drawn) {
    drawn = key
    grid.replaceChildren(...list.map(item => {
      const card = document.createElement('button')
      card.className = 'card'
      card.dataset.id = item.id
      const thumb = document.createElement('div')
      thumb.className = 'thumb'
      thumb.style.backgroundImage = item.thumb ? `url("${src(item, 'thumb')}")` : 'none'
      const name = Object.assign(document.createElement('div'), { className: 'name', textContent: item.name })
      const drop = Object.assign(document.createElement('span'), { className: 'drop', title: 'Listeden çıkar' })
      drop.setAttribute('role', 'button')
      drop.setAttribute('aria-label', `${item.name} dosyasını listeden çıkar`)
      drop.innerHTML = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l8 8M9 1l-8 8"/></svg>'
      drop.addEventListener('click', event => {
        event.stopPropagation()
        void act({ act: 'remove', id: item.id })
      })
      card.append(thumb, name, drop)
      card.addEventListener('click', () => {
        const isSecond = (mods & 3) !== 0
        choose(item.id, isSecond)

        if (!isSecond) {
          target = 0
        }
      })

      return card
    }))
  }

  if (!list.some(one => one.id === current)) {
    current = list[0]?.id ?? null
    second = null
  }

  if (second !== null && !list.some(one => one.id === second)) {
    second = null
  }

  show()
}

async function load() {
  const got = await (await fetch('/items')).json()
  items = got.items
  mode = got.filter

  // A file the mod asked for (a new one, or a path pressed in the chat) is
  // shown once, in whichever view holds it.
  if (got.pick.n !== picked) {
    picked = got.pick.n
    current = got.pick.id
    second = null
    target = 0
  }

  draw()
}

// With ctrl or alt down, the copy button shows the file in the Finder
// instead; the bridge says which modifiers are down before each press and
// when one changes while the pointer is over the pane.
function label() {
  const isHeld = (mods & 3) !== 0
  const text = isHeld ? 'Dizini aç' : 'Yolu kopyala'

  if (copy.textContent !== text) {
    copy.textContent = text
    copy.dataset.act = isHeld ? 'reveal' : 'copy'
    copy.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' })
  }
}

function hold(now) {
  mods = now
  label()
}

// A key the pane heard once a click gave it the keyboard: the arrows move
// the choice through the grid, space and return open the chosen file large.
function key(name) {
  const list = shown()
  const at = list.findIndex(one => one.id === current)

  if (at < 0) {
    return
  }

  if (name === ' ' || name === 'space' || name === 'return' || name === 'enter') {
    void act({ act: 'look', id: current })

    return
  }

  const across = getComputedStyle(grid).gridTemplateColumns.split(' ').length
  const step = { left: -1, right: 1, up: -across, down: across }[name]

  if (step === undefined) {
    return
  }

  const next = at + step

  if (next >= 0 && next < list.length) {
    choose(list[next].id, false)
    reveal()
  }
}

chips.addEventListener('click', event => {
  const next = event.target.dataset?.mode

  if (next && next !== mode) {
    mode = next
    draw()
    void act({ act: 'filter', mode })
  }
})

clear.addEventListener('click', () => void act({ act: 'clear' }))
single.addEventListener('click', () => choose(current, false))
layout.addEventListener('click', () => {
  chosen = layout.dataset.next
  show()
})

actions.addEventListener('click', event => {
  const button = event.target.closest('[data-act]')

  if (button === null || current === null) {
    return
  }

  void act({ act: button.dataset.act, id: current })

  if (button.dataset.act === 'copy') {
    button.textContent = 'Kopyalandı'
    setTimeout(label, 1400)
  }
})

// Text selected in a document is copied when the pointer lets go: the
// terminal keeps cmd+C for itself.
addEventListener('mouseup', () => {
  const picked = getSelection()
  const text = picked?.toString() ?? ''

  if (text.trim() !== '' && picked.anchorNode?.parentElement?.closest('.doc')) {
    void act({ act: 'text', text })
  }
})

// Called by the bridge for each wheel step: a wheel event of its own would
// land in whatever is under the pointer, and an embedded page keeps it. The
// steps are a terminal's; the page eases toward where they add up to, so
// what is streamed back moves evenly.
function nudge(dy, x, y) {
  const doc = docAt(x, y)

  // A document under the pointer takes the wheel until it is at its end;
  // from there the page moves, as it does everywhere else.
  if (doc !== null) {
    // Mid-flight the steps add up; at rest it starts from where the text
    // is, which a drag of its bar may have moved.
    const isFlying = inner.doc === doc && Math.abs(inner.target - inner.position) > 0.4
    const from = isFlying ? inner.target : doc.scrollTop
    const room = doc.scrollHeight - doc.clientHeight
    const next = Math.max(0, Math.min(room, from + dy))

    if (next !== from) {
      if (!isFlying) {
        inner.doc = doc
        inner.position = doc.scrollTop
      }

      inner.target = next

      return
    }
  }

  const most = scroller.scrollHeight - scroller.clientHeight
  target = Math.max(0, Math.min(most, target + dy))
}

// The document shown at a point of the window, given as shares of its width
// and height; null where there is none.
function docAt(x, y) {
  if (typeof x !== 'number' || typeof y !== 'number') {
    return null
  }

  const all = scroller.getBoundingClientRect()
  const px = all.left + x * all.width
  const py = all.top + y * all.height

  for (const doc of stage.querySelectorAll('.doc')) {
    const box = doc.getBoundingClientRect()

    if (px >= box.left && px <= box.right && py >= box.top && py <= box.bottom) {
      return doc
    }
  }

  return null
}

addEventListener('wheel', event => {
  event.preventDefault()
  nudge(event.deltaY, event.clientX / innerWidth, event.clientY / innerHeight)
}, { passive: false })

// Eased by the clock, not by the frame: a slow frame moves further, so the
// scroll takes the same time however fast the page is being sent.
let eased = performance.now()

function ease(now) {
  const most = Math.max(0, scroller.scrollHeight - scroller.clientHeight)
  const share = 1 - Math.exp(-(now - eased) / 70)
  eased = now
  target = Math.min(target, most)

  if (Math.abs(target - position) > 0.4) {
    position += (target - position) * share
    scroller.scrollTop = position
  }

  if (inner.doc !== null && !inner.doc.isConnected) {
    inner.doc = null
  } else if (inner.doc !== null && Math.abs(inner.target - inner.position) > 0.4) {
    inner.position += (inner.target - inner.position) * share
    inner.doc.scrollTop = inner.position
  }

  requestAnimationFrame(ease)
}

const fitStage = () => document.documentElement.style.setProperty('--tall', `${Math.round(scroller.clientHeight * 0.6)}px`)
addEventListener('resize', fitStage)
fitStage()
new EventSource('/events').onmessage = () => void load()
requestAnimationFrame(ease)
</script>
</body>
</html>
